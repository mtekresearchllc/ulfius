name: Library CI

on:
  push:
    branches: [master, "dev/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config check gnutls-bin \
            libmicrohttpd-dev libgnutls28-dev libjansson-dev libcurl4-gnutls-dev \
            zlib1g-dev
      - name: Build and test
        run: |
          make -C src -j"$(nproc)"
          LD_LIBRARY_PATH=/usr/local/lib make -C test VERBOSE=1 test
