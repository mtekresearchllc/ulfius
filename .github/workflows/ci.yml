name: Library CI

on:
  push:
    branches: [master, "dev/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config check gnutls-bin \
            libmicrohttpd-dev libgnutls28-dev libjansson-dev libcurl4-gnutls-dev \
            zlib1g-dev
      - name: Build and test
        run: |
          make -C src -j"$(nproc)"
          LD_LIBRARY_PATH=/usr/local/lib make -C test VERBOSE=1 test
      - name: Check legacy MHD ownership with sanitizers
        run: |
          gcc -std=gnu99 -Wall -Wextra -Werror -g -fno-omit-frame-pointer \
            -fsanitize=address,undefined -fno-sanitize-recover=undefined \
            -DU_TEST_MHD_AUTH_FREE -Iinclude \
            test/memory_mhd.c src/u_mhd.c src/u_string.c src/u_memory.c \
            -pthread -o "$RUNNER_TEMP/memory-mhd-legacy"
          ASAN_OPTIONS=detect_leaks=1 "$RUNNER_TEMP/memory-mhd-legacy"
